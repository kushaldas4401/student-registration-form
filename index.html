<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Registration </title>
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
        <p>Register for your favourite course</p>
    </header>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" autocomplete="name" placeholder="Enter your name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <br><br>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Enter 10 digits" required>
                <br><br>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </fieldset>
            <fieldset>
                <legend>Account Information</legend>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="20"autocomplete="new-password" required>
                <br><br>
                <label for="confirm">Confirm Password:</label>
                <input type="password" id="confirm" name="confirm" required>
                <br><br>
                <fieldset>
                    <legend>Gender</legend>
                    <label>
                        <input type="radio" name="gender" value="male" required>Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female">Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="other">Other
                    </label>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Select Your Skills</legend>
                    <label>
                        <input type="checkbox" name="skills" value="html">HTML
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="css">CSS
                    </label>
                    <label>
                        <input type="checkbox" name="skills" value="javascript">JavaScript
                    </label>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Course Information</legend>
                    <label for="course">Select Course:</label>
                    <select id="course" name="course" required>
                        <option value="disabled selected">Choose Course</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </fieldset>
                <br>
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" maxlength="200" required></textarea>
                <br><br>
                <button type="submit">Register Now</button>
                <button type="reset">Reset Form</button>

            </fieldset>
        </form>
    </main>
    <footer>
        <p>Copyright &copy; 2026 Student Academy. All rights reserved.</p>
    </footer>
</body>
</html>
